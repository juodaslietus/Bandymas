<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pukmuse.lt – dovanų kuponai</title>
<style>
:root{--bg:#efe9df;--ink:#2b2926;--line:#d8d1c7;--accent:#927759}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,390px) minmax(440px,1fr);gap:24px;max-width:1400px;margin:auto;padding:24px;align-items:start}
.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px #00000010}
.panel h1{margin:0 0 18px;font:700 25px Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:8px}.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;font:14px Arial,sans-serif}
textarea{min-height:68px;resize:vertical}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
button,.fileBtn{border:0;border-radius:10px;padding:11px 13px;font:700 13px Arial,sans-serif;cursor:pointer;background:#eee7df;color:#4c443c}
.primary{background:var(--accent);color:white}.status{margin-top:10px;background:#f4efe8;padding:9px 11px;border-radius:9px;font-size:12px;color:#625b53}
.note{font-size:11px;color:#766e67;line-height:1.4;margin:10px 0 0}.journal{border-top:1px solid #ece5dc;margin-top:16px;padding-top:14px}
.journal h2{font:700 17px Georgia,serif;margin:0 0 8px}.entries{max-height:160px;overflow:auto;border:1px solid #e7dfd7;border-radius:10px}
.entry{display:grid;grid-template-columns:52px 1fr 82px;gap:7px;padding:8px 9px;border-bottom:1px solid #eee7df;font-size:12px}.entry:last-child{border:0}
.preview{display:flex;justify-content:center}.voucher{width:min(100%,794px);aspect-ratio:1240/1754;position:relative;background:white;overflow:hidden;box-shadow:0 14px 36px #00000018;container-type:inline-size}
.voucher-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.recipient{position:absolute;left:7.5%;top:60.9%;width:83%;text-align:center;font:italic 5cqw Georgia,serif;color:#111;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity{position:absolute;left:60.5%;top:69.2%;width:32.5%;min-height:8%;display:flex;align-items:center;justify-content:center;text-align:center;font:2.45cqw/1.28 Arial,sans-serif;color:#111;padding:0 .5cqw}
.validity{position:absolute;right:5.8%;bottom:5.3%;text-align:right;font:1.75cqw/1.4 Arial,sans-serif;color:#111}
.number{position:absolute;right:5.8%;bottom:2.4%;text-align:right;font:1.75cqw/1.4 Arial,sans-serif;color:#111}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}.panel{padding:18px}.preview{overflow:hidden}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.panel{display:none}.app{display:block;padding:0;margin:0;max-width:none}.preview{display:block}.voucher{width:210mm;height:297mm;box-shadow:none;margin:0}}
</style>
</head>
<body>
<div class="app">
<section class="panel">
<h1>Dovanų kuponas</h1>
<div class="grid">
<div class="field full"><label>Vardas / gavėjas</label><input id="name"></div>
<div class="field"><label>Kupono tipas</label><select id="type"><option>Asmeninis</option><option>Grupinis</option><option>Laisvai įrašomas</option></select></div>
<div class="field"><label>Galioja iki</label><input id="valid" type="date"></div>
<div class="field"><label>Užsiėmimų skaičius</label><input id="count" type="number" min="1" value="1"></div>
<div class="field"><label>Kupono numeris</label><input id="number" inputmode="numeric" placeholder="pvz. 100"></div>
<div class="field full" id="peopleField" hidden><label>Asmenų skaičius</label><input id="people" type="number" min="1" value="4"></div>
<div class="field full" id="freeField" hidden><label>Laisvas tekstas</label><textarea id="freeText">Keramikos užsiėmimas</textarea></div>
</div>
<div class="buttons"><button class="primary" id="nextBtn">Gauti kupono numerį</button><button id="saveBtn">Saugoti PNG</button><button id="printBtn">PDF / spausdinti</button></div>
<div class="status" id="status"></div>
<div class="note">Numeracija ir kuponų sąrašas išsaugomi naršyklėje. Atsarginę kopiją galima eksportuoti.</div>
<div class="journal"><h2>Esami kuponai</h2><div class="entries" id="journal"></div><div class="buttons"><button id="exportBtn">Eksportuoti atsarginę kopiją</button><label class="fileBtn">Importuoti<input id="importFile" type="file" accept="application/json" hidden></label></div></div>
</section>
<main class="preview"><section class="voucher" id="coupon"><img id="voucherBg" class="voucher-bg" alt=""><div class="recipient" id="pName"></div><div class="activity" id="pOffer"></div><div class="validity">Galioja iki: <span id="pValid"></span></div><div class="number">NR.: <span id="pNumber"></span></div></section></main>
</div>
<script src="assets/vbg01.js"></script><script src="assets/vbg02.js"></script><script src="assets/vbg03.js"></script><script src="assets/vbg04.js"></script>
<script src="assets/vbg05.js"></script><script src="assets/vbg06.js"></script><script src="assets/vbg07.js"></script><script src="assets/vbg08.js"></script>
<script src="assets/vbg09.js"></script><script src="assets/vbg10.js"></script><script src="assets/vbg11.js"></script><script src="assets/vbg12.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id);
$('voucherBg').src='data:image/webp;base64,'+(window.__VBG||'');
const KEY='pukmuse_coupon_data_v2';
let data=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.journal)?v:{lastNumber:99,journal:[]}}catch(e){return{lastNumber:99,journal:[]}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));renderJournal();renderStatus()}
function renderStatus(){$('status').textContent='Paskutinis rezervuotas numeris: '+String(data.lastNumber).padStart(3,'0')+'. Kitas: '+String(Number(data.lastNumber)+1).padStart(3,'0')+'.'}
function sessions(n){n=Math.max(1,Number(n)||1);if(n===1)return '1 užsiėmimas';if(n<10)return n+' užsiėmimai';return n+' užsiėmimų'}
function offerText(){const t=$('type').value;if(t==='Asmeninis')return sessions($('count').value);if(t==='Grupinis')return 'Individualios grupės, vieno karto lipdymas. Iki '+Math.max(1,Number($('people').value)||1)+' asmenų.';return $('freeText').value.trim()||'Keramikos užsiėmimas'}
function update(){$('pName').textContent=$('name').value.trim();$('pOffer').textContent=offerText();$('pValid').textContent=$('valid').value||'—';const n=Number($('number').value);$('pNumber').textContent=Number.isFinite(n)&&n>0?String(n).padStart(3,'0'):'—';$('peopleField').hidden=$('type').value!=='Grupinis';$('freeField').hidden=$('type').value!=='Laisvai įrašomas'}
['name','valid','count','number','people','freeText'].forEach(id=>$(id).addEventListener('input',update));$('type').addEventListener('change',update);
$('nextBtn').onclick=()=>{const next=Number(data.lastNumber||99)+1;data.lastNumber=next;$('number').value=String(next).padStart(3,'0');persist();update()};
function register(){const num=Number($('number').value);if(!Number.isFinite(num)||num<1)return;if(!data.journal.some(x=>Number(x.number)===num))data.journal.unshift({number:num,name:$('name').value.trim(),valid:$('valid').value,type:$('type').value,offer:offerText(),created:new Date().toISOString()});if(num>Number(data.lastNumber))data.lastNumber=num;persist()}
function fileName(){const n=($('name').value.trim()||'Kuponas').replace(/[\\/:*?"<>|]+/g,' '),num=$('number').value||'';return 'Dovanu kuponas '+n+(num?' '+String(Number(num)).padStart(3,'0'):'')}
$('saveBtn').onclick=async()=>{register();const canvas=await html2canvas($('coupon'),{scale:2,backgroundColor:'#fff',useCORS:true});const a=document.createElement('a');a.download=fileName()+'.png';a.href=canvas.toDataURL('image/png');a.click()}
$('printBtn').onclick=()=>{register();window.print()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderJournal(){const el=$('journal');el.innerHTML='';if(!data.journal.length){el.innerHTML='<div class="entry"><span>—</span><span>Sąrašas tuščias</span><span>—</span></div>';return}for(const x of data.journal){const d=document.createElement('div');d.className='entry';d.innerHTML='<strong>'+String(x.number).padStart(3,'0')+'</strong><span>'+esc(x.name||x.type)+'</span><span>'+esc(x.valid||'')+'</span>';el.appendChild(d)}}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.download='Pukmuse-kuponu-duomenys.json';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||!Array.isArray(v.journal))throw 0;data=v;persist();alert('Kuponų duomenys importuoti.')}catch{alert('Nepavyko perskaityti atsarginės kopijos.')}};r.readAsText(f)}
renderStatus();renderJournal();update();
</script>
</body></html>
